# /etc/netplan/50-static.yaml на vm-ctrl
# Проверить: sudo netplan try  / применить: sudo netplan apply
network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: no
      addresses:
        - 192.168.1.131/24
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        addresses: [192.168.1.94]

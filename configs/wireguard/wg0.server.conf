# /etc/wireguard/wg0.conf на vm-vpn
# Права: chmod 600, владелец root
[Interface]
Address    = 10.10.0.1/24
ListenPort = 51820
PrivateKey = <REDACTED>
PostUp     = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -s 10.10.0.0/24 -o enp0s3 -j MASQUERADE
PostDown   = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -s 10.10.0.0/24 -o enp0s3 -j MASQUERADE

[Peer]
# Windows-клиент
PublicKey  = <CLIENT_PUBLIC_KEY_REDACTED>
AllowedIPs = 10.10.0.2/32

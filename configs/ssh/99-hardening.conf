# /etc/ssh/sshd_config.d/99-hardening.conf
# Скопировать на каждую VM: sudo cp 99-hardening.conf /etc/ssh/sshd_config.d/
# Проверить: sudo sshd -t && sudo systemctl reload ssh
PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
KbdInteractiveAuthentication no
X11Forwarding no
MaxAuthTries 3
ClientAliveInterval 300
ClientAliveCountMax 2
